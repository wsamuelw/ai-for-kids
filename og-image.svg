<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a29bfe"/>
      <stop offset="50%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#fd79a8"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#a29bfe"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="rgba(255,255,255,0.08)"/>
  <circle cx="1100" cy="500" r="200" fill="rgba(255,255,255,0.06)"/>
  <circle cx="600" cy="550" r="100" fill="rgba(255,255,255,0.05)"/>
  <!-- Bolt Robot -->
  <g transform="translate(100, 180)">
    <!-- Body -->
    <rect x="0" y="80" width="160" height="120" rx="20" fill="url(#bolt)"/>
    <!-- Head -->
    <rect x="20" y="0" width="120" height="100" rx="15" fill="url(#bolt)"/>
    <!-- Eyes -->
    <circle cx="55" cy="45" r="18" fill="#fff"/>
    <circle cx="105" cy="45" r="18" fill="#fff"/>
    <circle cx="55" cy="45" r="8" fill="#2d2d2d"/>
    <circle cx="105" cy="45" r="8" fill="#2d2d2d"/>
    <!-- Eye shine -->
    <circle cx="50" cy="40" r="4" fill="#fff"/>
    <circle cx="100" cy="40" r="4" fill="#fff"/>
    <!-- Mouth -->
    <path d="M55 70 Q80 90 105 70" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Antenna -->
    <line x1="80" y1="0" x2="80" y2="-30" stroke="#fff" stroke-width="4"/>
    <circle cx="80" cy="-35" r="8" fill="#fd79a8"/>
    <!-- Arms -->
    <rect x="-30" y="100" width="30" height="60" rx="10" fill="url(#bolt)"/>
    <rect x="160" y="100" width="30" height="60" rx="10" fill="url(#bolt)"/>
    <!-- Legs -->
    <rect x="30" y="200" width="35" height="50" rx="8" fill="url(#bolt)"/>
    <rect x="95" y="200" width="35" height="50" rx="8" fill="url(#bolt)"/>
  </g>
  <!-- Title -->
  <text x="350" y="220" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#fff">Bolt's AI</text>
  <text x="350" y="300" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#fff">Adventure!</text>
  <!-- Subtitle -->
  <text x="350" y="370" font-family="Arial, sans-serif" font-size="32" fill="rgba(255,255,255,0.9)">A fun, free course teaching kids</text>
  <text x="350" y="410" font-family="Arial, sans-serif" font-size="32" fill="rgba(255,255,255,0.9)">ages 5-7 about Artificial Intelligence</text>
  <!-- Features -->
  <text x="350" y="480" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)">🤖 Quizzes  ✨ Badges  🎓 Certificate</text>
  <!-- URL -->
  <text x="350" y="550" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.6)">wsamuelw.github.io/ai-for-kids</text>
</svg>